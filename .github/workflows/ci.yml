name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build -w packages/engine
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t medcare-twin:ci .
      - name: Smoke test container
        run: |
          docker run -d --name mc -p 8080:8080 -e APP_SECRET=$(openssl rand -hex 32) -e COOKIE_SECURE=false medcare-twin:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/api/health && break; sleep 1; done
          curl -fsS http://localhost:8080/ | grep -q "MedCare Twin"
          docker logs mc
