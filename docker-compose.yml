services:
  medcare:
    build: .
    image: medcare-twin:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_PATH: /data/medcare.db
    volumes:
      - medcare-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  medcare-data:
